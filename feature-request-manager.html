<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Request Manager - Tracker</title>
    <link rel="stylesheet" href="https://designsaplus.com/cdn/design-system.css">
    <style>
        .tw-hidden { display: none !important; }
        .flex { display: flex; }
        .flex-1 { flex: 1 1 0%; }
        .flex-col { flex-direction: column; }
        .flex-shrink-0 { flex-shrink: 0; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .mb-0 { margin-bottom: 0 !important; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-5 { margin-bottom: 1.5rem; }
        .mt-1 { margin-top: 0.25rem; }
        .mt-3 { margin-top: 0.75rem; }
        .me-2 { margin-inline-end: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-5 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .h2 { font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
        .h4 { font-size: 1.125rem; font-weight: 600; line-height: 1.3; }
        .h5 { font-size: 1rem; font-weight: 600; line-height: 1.3; }
        .fw-medium { font-weight: 500; }
        .fw-semibold { font-weight: 600; }
        .text-body-s { font-size: 0.875rem; }
        .text-body-xs { font-size: 0.75rem; }
        .text-center { text-align: center; }
        .text-muted { color: #6b7280; }
        .text-primary { color: #273c91; }
        .text-success { color: #16a34a; }
        .text-danger { color: #dc2626; }
        .text-warning { color: #d97706; }
        .text-info { color: #0891b2; }
        .bg-background { background-color: #f0f4fa; }
        .bg-white { background-color: #fff; }
        .bg-green-100 { background-color: #f0fdf4; }
        .w-full { width: 100%; }
        .cursor-pointer { cursor: pointer; }
        .overflow-hidden { overflow: hidden; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .min-w-0 { min-width: 0; }
        .flex-wrap { flex-wrap: wrap; }
        .flex-shrink-0 { flex-shrink: 0; }
        .max-w-screen-md { max-width: 768px; }
        .text-sm { font-size: 0.875rem; }
    </style>
    <script src="https://designsaplus.com/cdn/design-system.js"></script>
    <script src="https://kit.fontawesome.com/a7c8263a8e.js" crossorigin="anonymous"></script>
</head>
<body class="bg-background">
    <div class="sidebar-topbar-content-offset">
        <div class="container py-5 px-4 max-w-screen-xl mx-auto">
            
            <!-- Page Header -->
            <div class="flex items-center justify-between mb-5">
                <div>
                    <h1 class="h2 mb-1">Feature Request Tracker</h1>
                    <p class="text-muted text-body-s">Source: Feedback Tracker Slack List</p>
                </div>
                <div class="flex items-center gap-3">
                    <span id="lastSync" class="text-body-xs text-muted"></span>
                    <button id="syncBtn" class="btn btn-secondary" type="button" onclick="loadData()">
                        <i class="fa-solid fa-sync me-2"></i>Refresh
                    </button>
                </div>
            </div>
            
            <!-- Stats Cards -->
            <div class="flex gap-3 mb-5 flex-wrap">
                <button onclick="filterByStatus('all')" data-status="all" class="tw-card p-3 cursor-pointer stat-btn flex-1 min-w-24 text-center border-2 transition">
                    <div class="text-body-xs text-muted mb-1">Total</div>
                    <div id="stat-all" class="text-2xl fw-bold" style="color: #273c91;">0</div>
                </button>
                <button onclick="filterByStatus('pending')" data-status="pending" class="tw-card p-3 cursor-pointer stat-btn flex-1 min-w-24 text-center border-2 transition">
                    <div class="text-body-xs text-muted mb-1">New</div>
                    <div id="stat-pending" class="text-2xl fw-bold" style="color: #f59e0b;">0</div>
                </button>
                <button onclick="filterByStatus('review')" data-status="review" class="tw-card p-3 cursor-pointer stat-btn flex-1 min-w-24 text-center border-2 transition">
                    <div class="text-body-xs text-muted mb-1">Accepted</div>
                    <div id="stat-review" class="text-2xl fw-bold" style="color: #3b82f6;">0</div>
                </button>
                <button onclick="filterByStatus('refining')" data-status="refining" class="tw-card p-3 cursor-pointer stat-btn flex-1 min-w-24 text-center border-2 transition">
                    <div class="text-body-xs text-muted mb-1">In Progress</div>
                    <div id="stat-refining" class="text-2xl fw-bold" style="color: #8b5cf6;">0</div>
                </button>
                <button onclick="filterByStatus('complete')" data-status="complete" class="tw-card p-3 cursor-pointer stat-btn flex-1 min-w-24 text-center border-2 transition">
                    <div class="text-body-xs text-muted mb-1">Completed</div>
                    <div id="stat-complete" class="text-2xl fw-bold" style="color: #10b981;">0</div>
                </button>
                <button onclick="filterByStatus('rejected')" data-status="rejected" class="tw-card p-3 cursor-pointer stat-btn flex-1 min-w-24 text-center border-2 transition">
                    <div class="text-body-xs text-muted mb-1">Rejected</div>
                    <div id="stat-rejected" class="text-2xl fw-bold" style="color: #dc2626;">0</div>
                </button>
            </div>
            
            <!-- Search -->
            <div class="mb-4">
                <div class="relative">
                    <i class="fa-solid fa-search absolute items-center" style="left: 1rem; top: 50%; transform: translateY(-50%); color: #9ca3af;"></i>
                    <input type="text" id="searchInput" placeholder="Search by subject, area, or details..." 
                        class="form-control" style="padding-left: 2.5rem;" oninput="renderRequests()">
                </div>
            </div>
            
            <!-- Request List -->
            <div id="requestList" class="space-y-3">
                <div class="tw-card p-5 text-center text-muted">
                    <i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i>
                    <p>Loading feature requests...</p>
                </div>
            </div>
            
        </div>
    </div>
    
    <!-- Detail Modal -->
    <div data-controller="popup" id="detailModal" class="tw-hidden">
        <div class="popup-overlay" data-action="click->popup#close"></div>
        <div class="popup-panel" role="dialog" aria-modal="true" style="max-width: 700px; max-height: 90vh; overflow-y: auto;">
            <div class="popup-header">
                <h2 class="popup-header-title">Request Details</h2>
                <button class="popup-close" type="button" aria-label="Close" data-action="click->popup#close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="popup-body" id="modalContent"></div>
            <div class="popup-footer">
                <button class="btn btn-secondary" type="button" data-action="click->popup#close">Close</button>
                <button id="modalActionBtn" class="btn btn-primary" type="button"></button>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div data-controller="floating-notification" id="toast" class="tw-hidden">
        <div class="floating-notification-content">
            <i id="toastIcon" class="fa-solid fa-check-circle text-success me-2"></i>
            <span id="toastMessage"></span>
        </div>
    </div>

    <script>
        let allRequests = [];
        let filteredRequests = [];
        let currentFilter = 'all';
        let selectedRequest = null;
        
        // Load data from JSON
        async function loadData() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Loading...';
            
            try {
                const response = await fetch('./feature-requests.json');
                const data = await response.json();
                
                allRequests = data.requests.map(r => ({
                    ...r,
                    // Ensure status is mapped correctly
                    status: r.status || 'pending'
                }));
                
                // Restore any local status changes (only if explicitly set before)
                const savedStatuses = JSON.parse(localStorage.getItem('fr_statuses') || '{}');
                const hasJsonStatus = allRequests.some(r => r.status && r.status !== 'pending');
                // Only use localStorage if JSON didn't have proper statuses
                if (!hasJsonStatus) {
                    allRequests.forEach(r => {
                        if (savedStatuses[r.id]) {
                            r.status = savedStatuses[r.id];
                            r.productTeamNote = savedStatuses[r.id + '_note'] || r.productTeamNote;
                        }
                    });
                }
                
                updateStats();
                renderRequests();
                
                document.getElementById('lastSync').textContent = 
                    'Loaded ' + allRequests.length + ' requests';
                
            } catch (error) {
                console.error('Load error:', error);
                showToast('Failed to load data', 'error');
            }
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-sync me-2"></i>Refresh';
        }
        
        // Save status changes
        function saveStatus(id, status, note) {
            const saved = JSON.parse(localStorage.getItem('fr_statuses') || '{}');
            saved[id] = status;
            if (note !== undefined) {
                saved[id + '_note'] = note;
            }
            localStorage.setItem('fr_statuses', JSON.stringify(saved));
        }
        
        // Update stats
        function updateStats() {
            const stats = {
                all: allRequests.length,
                pending: allRequests.filter(r => r.status === 'pending').length,
                review: allRequests.filter(r => r.status === 'review').length,
                refining: allRequests.filter(r => r.status === 'refining').length,
                complete: allRequests.filter(r => r.status === 'complete').length,
                rejected: allRequests.filter(r => r.status === 'rejected').length
            };
            
            for (const [key, value] of Object.entries(stats)) {
                const el = document.getElementById('stat-' + key);
                if (el) el.textContent = value;
            }
            
            // Update filter button borders
            document.querySelectorAll('.stat-btn').forEach(btn => {
                const status = btn.dataset.status;
                btn.style.borderColor = status === currentFilter ? '#ec634b' : 'transparent';
            });
        }
        
        // Filter by status
        function filterByStatus(status) {
            currentFilter = status;
            updateStats();
            renderRequests();
        }
        
        // Render requests list
        function renderRequests() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            filteredRequests = allRequests.filter(r => {
                const matchesFilter = currentFilter === 'all' || r.status === currentFilter;
                const matchesSearch = !search || 
                    r.subject.toLowerCase().includes(search) ||
                    (r.area || '').toLowerCase().includes(search) ||
                    (r.details || '').toLowerCase().includes(search) ||
                    (r.type || '').toLowerCase().includes(search);
                return matchesFilter && matchesSearch;
            });
            
            const container = document.getElementById('requestList');
            
            if (filteredRequests.length === 0) {
                container.innerHTML = `
                    <div class="tw-card p-5 text-center text-muted">
                        <i class="fa-solid fa-inbox text-3xl mb-3"></i>
                        <p>No requests found</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filteredRequests.map(r => `
                <div class="tw-card p-4 cursor-pointer hover:shadow-md transition" onclick="openDetail(${r.id})">
                    <div class="flex items-start gap-4">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-2 flex-wrap">
                                ${getStatusBadge(r.status)}
                                <span class="text-body-xs text-muted">${r.type || 'Enhancement'}</span>
                                <span class="text-body-xs px-2 py-0.5 rounded" style="background: #f3f4f6;">${r.area || 'Unknown'}</span>
                                ${isHighPriority(r.importance) ? '<span class="badge badge-danger-subtle">HIGH</span>' : ''}
                            </div>
                            <h3 class="h5 mb-2" style="color: #273c91;">${escapeHtml(r.subject)}</h3>
                            <p class="text-body-s text-muted mb-3 truncate-2-lines">${escapeHtml(r.details || '')}</p>
                            
                            ${r.productTeamNote ? `
                            <div class="p-3 rounded mb-3" style="background: #eff6ff; border-left: 3px solid #3b82f6;">
                                <p class="text-body-s mb-0" style="white-space: pre-wrap;">${escapeHtml(r.productTeamNote)}</p>
                            </div>
                            ` : ''}
                            
                            <div class="flex items-center gap-4 text-body-xs text-muted">
                                <span><i class="fa-solid fa-user me-1"></i>${escapeHtml(r.submittedBy || 'Unknown')}</span>
                                <span><i class="fa-solid fa-calendar me-1"></i>${formatDate(r.submittedAt)}</span>
                                ${r.jiraKey ? `<span class="text-info"><i class="fa-brands fa-jira me-1"></i>${r.jiraKey}</span>` : ''}
                                ${r.url ? `<a href="${escapeHtml(r.url)}" target="_blank" class="text-info" onclick="event.stopPropagation();"><i class="fa-solid fa-external-link me-1"></i>Link</a>` : ''}
                            </div>
                        </div>
                        
                        <div class="flex flex-col gap-2 flex-shrink-0">
                            ${getQuickActions(r)}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function isHighPriority(importance) {
            if (!importance) return false;
            const imp = importance.toLowerCase();
            return imp === 'critical' || imp === 'high' || imp === 'high!';
        }
        
        function getStatusBadge(status) {
            const badges = {
                'pending': '<span class="badge badge-warning-subtle badge-dot">New</span>',
                'review': '<span class="badge" style="background: #dbeafe; color: #2563eb;">Accepted</span>',
                'refining': '<span class="badge" style="background: #f3e8ff; color: #9333ea;">In Progress</span>',
                'complete': '<span class="badge badge-success-subtle"><i class="fa-solid fa-check"></i> Completed</span>',
                'rejected': '<span class="badge badge-danger-subtle"><i class="fa-solid fa-ban"></i> Rejected</span>'
            };
            return badges[status] || badges['pending'];
        }
        
        function getQuickActions(r) {
            if (r.status === 'pending') {
                return `
                    <button class="btn btn-sm" style="background: #10b981; color: white;" onclick="event.stopPropagation(); setStatus(${r.id}, 'review')">
                        <i class="fa-solid fa-check me-1"></i>Accept
                    </button>
                `;
            } else if (r.status === 'review') {
                return `
                    <button class="btn btn-sm" style="background: #8b5cf6; color: white;" onclick="event.stopPropagation(); setStatus(${r.id}, 'refining')">
                        <i class="fa-solid fa-spinner me-1"></i>Start
                    </button>
                `;
            } else if (r.status === 'refining') {
                return `
                    <button class="btn btn-sm" style="background: #10b981; color: white;" onclick="event.stopPropagation(); setStatus(${r.id}, 'complete')">
                        <i class="fa-solid fa-check me-1"></i>Complete
                    </button>
                `;
            }
            return '';
        }
        
        function setStatus(id, newStatus) {
            const r = allRequests.find(req => req.id === id);
            if (!r) return;
            
            const oldStatus = r.status;
            r.status = newStatus;
            
            // Save to localStorage
            saveStatus(id, newStatus);
            
            updateStats();
            renderRequests();
            
            const statusNames = {
                'review': 'Accepted',
                'refining': 'In Progress',
                'complete': 'Completed',
                'rejected': 'Rejected'
            };
            showToast(`Status changed to ${statusNames[newStatus]}`);
        }
        
        function openDetail(id) {
            selectedRequest = allRequests.find(r => r.id === id);
            if (!selectedRequest) return;
            
            const r = selectedRequest;
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            const actionBtn = document.getElementById('modalActionBtn');
            
            content.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="text-body-xs text-muted">Subject</label>
                        <p class="fw-semibold" style="color: #273c91;">${escapeHtml(r.subject)}</p>
                    </div>
                    
                    <div class="flex gap-4 flex-wrap">
                        <div>
                            <label class="text-body-xs text-muted">Type</label>
                            <p>${r.type || 'Enhancement'}</p>
                        </div>
                        <div>
                            <label class="text-body-xs text-muted">Importance</label>
                            <span class="badge ${isHighPriority(r.importance) ? 'badge-danger-subtle' : 'badge-neutral-subtle'}">${r.importance || 'Normal'}</span>
                        </div>
                        <div>
                            <label class="text-body-xs text-muted">Status</label>
                            ${getStatusBadge(r.status)}
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-body-xs text-muted">Feature Area</label>
                        <p>${escapeHtml(r.area || 'Unknown')}</p>
                    </div>
                    
                    ${r.details ? `
                    <div>
                        <label class="text-body-xs text-muted">Details</label>
                        <p style="white-space: pre-wrap;">${escapeHtml(r.details)}</p>
                    </div>
                    ` : ''}
                    
                    ${r.impact ? `
                    <div>
                        <label class="text-body-xs text-muted">Impact</label>
                        <p style="white-space: pre-wrap;">${escapeHtml(r.impact)}</p>
                    </div>
                    ` : ''}
                    
                    ${r.solution ? `
                    <div>
                        <label class="text-body-xs text-muted">Suggested Solution</label>
                        <p style="white-space: pre-wrap;">${escapeHtml(r.solution)}</p>
                    </div>
                    ` : ''}
                    
                    ${r.productTeamNote ? `
                    <div class="p-3 rounded" style="background: #eff6ff; border-left: 3px solid #3b82f6;">
                        <label class="text-body-xs fw-semibold" style="color: #3b82f6;">
                            <i class="fa-solid fa-sticky-note me-1"></i>Product Team Note
                        </label>
                        <p class="mt-2 mb-0" style="white-space: pre-wrap;">${escapeHtml(r.productTeamNote)}</p>
                    </div>
                    ` : ''}
                    
                    ${r.jiraKey ? `
                    <div>
                        <label class="text-body-xs text-muted">Jira Story</label>
                        <a href="https://ulasdev.atlassian.net/browse/${r.jiraKey}" target="_blank" class="text-info">${r.jiraKey}</a>
                    </div>
                    ` : ''}
                    
                    <div class="flex gap-4 text-body-xs text-muted">
                        <span><i class="fa-solid fa-user me-1"></i>${escapeHtml(r.submittedBy || 'Unknown')}</span>
                        <span><i class="fa-solid fa-calendar me-1"></i>${formatDate(r.submittedAt)}</span>
                    </div>
                    
                    ${r.url ? `
                    <div>
                        <label class="text-body-xs text-muted">System URL</label>
                        <a href="${escapeHtml(r.url)}" target="_blank" class="text-info">${escapeHtml(r.url)}</a>
                    </div>
                    ` : ''}
                </div>
            `;
            
            // Set action button
            if (r.status === 'pending') {
                actionBtn.innerHTML = '<i class="fa-solid fa-check me-2"></i>Accept';
                actionBtn.onclick = () => { setStatus(r.id, 'review'); closeModal(); };
                actionBtn.style.display = '';
            } else if (r.status === 'review') {
                actionBtn.innerHTML = '<i class="fa-solid fa-spinner me-2"></i>Start Working';
                actionBtn.onclick = () => { setStatus(r.id, 'refining'); closeModal(); };
                actionBtn.style.display = '';
            } else if (r.status === 'refining') {
                actionBtn.innerHTML = '<i class="fa-solid fa-check me-2"></i>Mark Complete';
                actionBtn.onclick = () => { setStatus(r.id, 'complete'); closeModal(); };
                actionBtn.style.display = '';
            } else {
                actionBtn.style.display = 'none';
            }
            
            modal.classList.remove('tw-hidden');
        }
        
        function closeModal() {
            document.getElementById('detailModal').classList.add('tw-hidden');
            selectedRequest = null;
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            
            msg.textContent = message;
            icon.className = type === 'error' ? 'fa-solid fa-exclamation-circle text-danger me-2' : 'fa-solid fa-check-circle text-success me-2';
            
            toast.classList.remove('tw-hidden');
            setTimeout(() => toast.classList.add('tw-hidden'), 4000);
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatDate(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        
        // Add CSS for line clamp
        document.addEventListener('DOMContentLoaded', function() {
            const style = document.createElement('style');
            style.textContent = `.truncate-2-lines { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }`;
            document.head.appendChild(style);
            
            loadData();
        });
    </script>
</body>
</html>
